<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charkive &mdash; {% block title %}Dashboard{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-mark" aria-hidden="true">C</span>
      <span class="brand-lockup"><span class="brand-text">CHARKIVE</span><span class="brand-caption">SAN care, turned up</span></span>
    </div>
    <nav class="sidebar-nav">
      <a href="/dashboard" class="nav-item {% if active_page == 'dashboard' %}active{% endif %}">
        <span class="nav-icon">&#x2302;</span><span class="nav-label">Dashboard</span>
      </a>
      <a href="/scans" class="nav-item {% if active_page == 'scans' %}active{% endif %}">
        <span class="nav-icon">&#x2630;</span><span class="nav-label">Scans</span>
      </a>
      <a href="/sanitorium" class="nav-item {% if active_page == 'sanitorium' %}active{% endif %}">
        <span class="nav-icon">&#x2691;</span><span class="nav-label">Sanitorium</span>
      </a>
      <a href="/curation" class="nav-item {% if active_page == 'curation' %}active{% endif %}">
        <span class="nav-icon">&#x2605;</span><span class="nav-label">Curation</span>
      </a>
      <a href="/config" class="nav-item {% if active_page == 'config' %}active{% endif %}">
        <span class="nav-icon">&#x2699;</span><span class="nav-label">Config</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <span class="live-label"><span class="status-dot online"></span> LOCAL CONSOLE</span>
      <span class="tagline">Keep the masters. Burn the fluff.</span>
    </div>
  </aside>

  <main class="main">
    <header class="main-header">
      <div class="header-title">
        <span class="header-kicker">CHARKIVE / FIELD CONSOLE</span>
        <h1>{% block heading %}Dashboard{% endblock %}</h1>
      </div>
      <div class="header-status" id="header-status">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Loading...</span>
      </div>
    </header>
    <div class="content">
      {% block content %}{% endblock %}
    </div>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="/static/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
