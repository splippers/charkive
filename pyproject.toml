[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "charkive"
version = "1.0.0"
description = "Burn away SAN fluff — quarantine caches, orphans, shyte tiers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.3",
  "pyyaml>=6.0.1",
  "pathspec>=0.12.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1"]

[project.scripts]
charkive = "charkive.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
charkive = ["web/templates/*", "web/static/*"]
